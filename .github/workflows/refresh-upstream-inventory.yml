name: Refresh upstream model inventory

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Hugging Face branch, tag, or commit to inspect
        required: false
        default: main
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-upstream-inventory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inventory dependency
        run: python -m pip install --upgrade huggingface_hub

      - name: Generate upstream inventory
        env:
          REQUESTED_REVISION: ${{ inputs.revision || 'main' }}
        run: |
          python scripts/update_upstream_inventory.py \
            --revision "$REQUESTED_REVISION" \
            --output upstream-inventory.json

      - name: Commit inventory when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream-inventory.json
          if git diff --cached --quiet; then
            echo "Upstream inventory has not changed."
          else
            git commit -m "Refresh upstream Kimi K3 inventory"
            git push
          fi
